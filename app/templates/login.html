<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087cff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Clipboard">
  <title>Вход - Local Clipboard</title>
  <link rel="icon" href="/static/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <form class="login-card" method="post" action="/login" autocomplete="off">
      <h1>Local Clipboard</h1>
      <p>Введите пароль для доступа к локальному буферу.</p>
      {% if error %}
      <div class="notice error">{{ error }}</div>
      {% endif %}
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required autofocus autocomplete="current-password">
      <button type="submit">Войти</button>
    </form>
  </main>
</body>
</html>
